name: test
on:
  push:
  pull_request:
  schedule:
    - cron: '17 9 * * 1' # weekly live check that the state services still answer
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 20
      - run: npm test
      - name: Live checks against state GIS services
        run: npm run test:live
        continue-on-error: ${{ github.event_name != 'schedule' }}
