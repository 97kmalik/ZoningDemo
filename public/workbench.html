<title>NJ Zoning Envelope</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Archivo:wdth,wght@62..125,400..800&family=Public+Sans:ital,wght@0,400;0,500;0,600;1,400&display=swap">
<style>
/* Layout: tax-map sheet. Left rail = the parcel record and every editable standard; right = the drawing and the math, summary first. */
:root{
  --paper:#eef1ec; --sheet:#f8faf6; --ink:#17242b; --graphite:#56656b; --rule:#cbd4cd; --rule-soft:#dfe5e0;
  --plan:#1f4e79; --plan-soft:#dbe6f0; --resi:#e5bf3d; --resi-soft:#f5e7b3; --comm:#c2453a; --ind:#7a5aa6;
  --good:#2f7a4f; --good-soft:#dcefe2; --warn:#a86a12; --warn-soft:#f7ead2; --bad:#b23a33; --bad-soft:#f6dcd9;
  --display:"Archivo","Arial Narrow",system-ui,sans-serif; --body:"Public Sans",system-ui,-apple-system,"Segoe UI",sans-serif;
  --r:6px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#0f1619; --sheet:#162024; --ink:#e3e9e5; --graphite:#9aa8ad; --rule:#2c3a3f; --rule-soft:#223035;
  --plan:#86b3dd; --plan-soft:#1d3346; --resi:#d9b443; --resi-soft:#3a3218; --comm:#e0776c; --ind:#ab8fd6;
  --good:#6cc08f; --good-soft:#18352a; --warn:#e2a957; --warn-soft:#3a2c14; --bad:#ee8079; --bad-soft:#3d1f1d; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#0f1619; --sheet:#162024; --ink:#e3e9e5; --graphite:#9aa8ad; --rule:#2c3a3f; --rule-soft:#223035;
  --plan:#86b3dd; --plan-soft:#1d3346; --resi:#d9b443; --resi-soft:#3a3218; --comm:#e0776c; --ind:#ab8fd6;
  --good:#6cc08f; --good-soft:#18352a; --warn:#e2a957; --warn-soft:#3a2c14; --bad:#ee8079; --bad-soft:#3d1f1d; color-scheme:dark}
*{box-sizing:border-box}
body{background:var(--paper);color:var(--ink);font:15px/1.5 var(--body);padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:20px 48px}
.wrap{max-width:1360px;margin:0 auto;display:flex;flex-direction:column;gap:18px}
h1,h2,h3{font-family:var(--display);font-stretch:82%;letter-spacing:-.005em;text-wrap:balance;margin:0}
h1{font-size:1.15rem;font-weight:700;font-stretch:100%}
h2{font-size:1.25rem;font-weight:700}
h3{font-size:1rem;font-weight:650}
p{margin:0}
a{color:var(--plan)}
button,input,select,textarea{font:inherit;color:inherit}
:focus-visible{outline:2px solid var(--plan);outline-offset:2px}
.num{font-variant-numeric:tabular-nums}
.muted{color:var(--graphite)}
.small{font-size:.84rem}

/* masthead */
.mast{display:flex;flex-wrap:wrap;align-items:center;justify-content:space-between;gap:12px}
.mast .brand{display:flex;align-items:center;gap:10px}
.mark{width:28px;height:28px;flex:none}
.mast .actions{display:flex;flex-wrap:wrap;gap:8px}

.btn{border:1px solid var(--rule);background:var(--sheet);border-radius:var(--r);padding:7px 12px;cursor:pointer;font-weight:500;font-size:.9rem;display:inline-flex;align-items:center;gap:6px}
.btn:hover{border-color:var(--plan)}
.btn.primary{background:var(--plan);border-color:var(--plan);color:var(--sheet)}
.btn.primary:hover{filter:brightness(1.08)}
.btn:disabled{opacity:.55;cursor:default}
.btn.ghost{background:transparent}

/* query panel */
.query{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:16px;display:flex;flex-direction:column;gap:12px}
.tabs{display:flex;gap:4px;flex-wrap:wrap;border-bottom:1px solid var(--rule)}
.tab{border:0;background:none;padding:8px 12px;cursor:pointer;color:var(--graphite);border-bottom:2px solid transparent;margin-bottom:-1px;font-weight:500}
.tab[aria-selected="true"]{color:var(--ink);border-bottom-color:var(--plan)}
.qrow{display:flex;flex-wrap:wrap;gap:10px;align-items:end}
.qrow label{display:flex;flex-direction:column;gap:4px;font-size:.82rem;color:var(--graphite);flex:1 1 140px;min-width:0}
.qrow label.wide{flex:3 1 320px}
.qrow[data-panel]{flex:1 1 320px}
@media (max-width:980px){.results{order:-1}}
.where{font-size:.86rem;color:var(--graphite)}
input[type=text],input[type=number],select,textarea{background:var(--paper);border:1px solid var(--rule);border-radius:4px;padding:7px 9px;width:100%;min-width:0}
textarea{resize:vertical;min-height:90px;font-size:.86rem;line-height:1.45}
input:focus,select:focus,textarea:focus{border-color:var(--plan);outline:none;box-shadow:0 0 0 3px var(--plan-soft)}
.log{font-size:.84rem;color:var(--graphite);max-height:130px;overflow:auto;border-left:2px solid var(--rule);padding-left:10px;display:flex;flex-direction:column;gap:2px}
.log:empty{display:none}
.notice{border-radius:var(--r);padding:10px 12px;font-size:.88rem;display:flex;gap:10px;align-items:flex-start}
.notice.info{background:var(--plan-soft)}
.notice.warn{background:var(--warn-soft)}
.notice.bad{background:var(--bad-soft)}
.notice.example{background:var(--resi-soft)}

/* sheet */
.sheet{display:grid;grid-template-columns:minmax(0,370px) minmax(0,1fr);gap:18px;align-items:start}
@media (max-width:980px){.sheet{grid-template-columns:minmax(0,1fr)}}
.rail{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);overflow:hidden}
.record{padding:16px;border-bottom:1px solid var(--rule);display:flex;flex-direction:column;gap:6px}
.record .addr{font-family:var(--display);font-stretch:88%;font-size:1.35rem;font-weight:700;line-height:1.15}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:5px;border-radius:999px;padding:2px 9px;font-size:.78rem;font-weight:600;border:1px solid var(--rule);background:var(--paper)}
.chip.district{background:var(--resi-soft);border-color:var(--resi)}
.chip.high{background:var(--good-soft);border-color:transparent;color:var(--good)}
.chip.medium{background:var(--warn-soft);border-color:transparent;color:var(--warn)}
.chip.low{background:var(--bad-soft);border-color:transparent;color:var(--bad)}
details.grp{border-bottom:1px solid var(--rule-soft)}
details.grp>summary{list-style:none;cursor:pointer;padding:11px 16px;display:flex;justify-content:space-between;align-items:center;font-weight:600;font-size:.92rem}
details.grp>summary::-webkit-details-marker{display:none}
details.grp>summary::after{content:"";width:8px;height:8px;border-right:1.5px solid var(--graphite);border-bottom:1.5px solid var(--graphite);transform:rotate(45deg);transition:transform .15s}
details.grp[open]>summary::after{transform:rotate(-135deg)}
.fields{display:grid;grid-template-columns:1fr 1fr;gap:8px 10px;padding:0 16px 14px}
.f{display:flex;flex-direction:column;gap:3px;min-width:0}
.f.full{grid-column:1/-1}
.f>span{font-size:.78rem;color:var(--graphite);display:flex;justify-content:space-between;gap:6px}
.f>span i{font-style:normal;opacity:.8}
.f input[type=number]{font-variant-numeric:tabular-nums}
.f.check{flex-direction:row;align-items:center;gap:8px;font-size:.86rem}
.f.flagged input{border-color:var(--warn)}

/* results */
.results{display:flex;flex-direction:column;gap:18px;min-width:0}
.card{background:var(--sheet);border:1px solid var(--rule);border-radius:var(--r);padding:18px;display:flex;flex-direction:column;gap:14px;min-width:0}
.verdict{font-family:var(--display);font-stretch:78%;font-weight:700;font-size:clamp(1.5rem,3.2vw,2.3rem);line-height:1.08;letter-spacing:-.01em;text-wrap:balance}
.verdict em{font-style:normal;background:linear-gradient(transparent 62%,var(--resi-soft) 62%)}
.tallies{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:0;border-top:1px solid var(--rule);border-left:1px solid var(--rule)}
.tally{border-right:1px solid var(--rule);border-bottom:1px solid var(--rule);padding:10px 12px;display:flex;flex-direction:column;gap:2px;min-width:0}
.tally b{font-family:var(--display);font-stretch:85%;font-size:1.45rem;font-weight:700;font-variant-numeric:tabular-nums;line-height:1.1}
.tally span{font-size:.78rem;color:var(--graphite)}
.tally small{font-size:.76rem;color:var(--plan);font-weight:600}
.drawings{display:grid;grid-template-columns:minmax(0,1.25fr) minmax(0,1fr);gap:14px}
@media (max-width:720px){.drawings{grid-template-columns:minmax(0,1fr)}}
.drawing{border:1px solid var(--rule-soft);border-radius:4px;background:var(--paper);padding:8px;min-width:0}
.drawing svg{display:block;width:100%;height:auto}
.drawing figcaption{font-size:.78rem;color:var(--graphite);padding:4px 4px 0}
.svg-text{font-family:var(--body);font-size:11px;fill:var(--graphite)}
.svg-strong{font-family:var(--display);font-size:12px;font-weight:700;fill:var(--ink)}

.scen-tabs{display:flex;gap:6px;flex-wrap:wrap}
.scen-tab{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:4px 12px;cursor:pointer;font-size:.86rem}
.scen-tab[aria-pressed="true"]{background:var(--ink);color:var(--sheet);border-color:var(--ink)}

.ladder{display:flex;flex-direction:column;gap:7px}
.rung{display:grid;grid-template-columns:minmax(0,210px) minmax(0,1fr) 92px;gap:10px;align-items:center;font-size:.86rem}
@media (max-width:560px){.rung{grid-template-columns:minmax(0,1fr) 84px}.rung .bar{grid-column:1/-1;grid-row:2}}
.rung .bar{height:10px;background:var(--rule-soft);border-radius:2px;position:relative;overflow:hidden}
.rung .bar i{position:absolute;inset:0 auto 0 0;background:var(--graphite);opacity:.45}
.rung.binding .bar i{background:var(--plan);opacity:1}
.rung.binding{font-weight:600}
.rung .v{text-align:right;font-variant-numeric:tabular-nums}
.rung.na{color:var(--graphite)}
.rung.na .v{font-style:italic}

.grid2{display:grid;grid-template-columns:repeat(auto-fit,minmax(280px,1fr));gap:18px}
.tbl{width:100%;border-collapse:collapse;font-size:.88rem}
.tbl td,.tbl th{padding:6px 4px;border-bottom:1px solid var(--rule-soft);text-align:left;vertical-align:top}
.tbl th{font-weight:600;color:var(--graphite);font-size:.8rem}
.tbl td.r,.tbl th.r{text-align:right;font-variant-numeric:tabular-nums;white-space:nowrap}
.tbl tr.total td{font-weight:700;border-top:1.5px solid var(--ink);border-bottom:0}
.tbl tr.neg td.r{color:var(--bad)}
.scroll{overflow-x:auto}
.uses{display:grid;grid-template-columns:repeat(auto-fit,minmax(180px,1fr));gap:12px}
.uses ul{margin:4px 0 0;padding-left:18px;font-size:.88rem}
.uses h4{margin:0;font-size:.84rem;font-weight:600;display:flex;align-items:center;gap:6px}
.dot{width:9px;height:9px;border-radius:2px;display:inline-block;flex:none}
.flags{display:flex;flex-direction:column;gap:8px}
.flag{display:grid;grid-template-columns:4px minmax(0,1fr);gap:10px;font-size:.88rem}
.flag>i{border-radius:2px;background:var(--graphite)}
.flag.high>i{background:var(--bad)}
.flag.positive>i{background:var(--good)}
.flag.info>i{background:var(--plan)}
.flag.caution>i{background:var(--warn)}
.flag b{font-weight:600}
.pill{display:inline-block;border-radius:4px;padding:1px 7px;font-size:.78rem;font-weight:600}
.pill.ok{background:var(--good-soft);color:var(--good)}
.pill.no{background:var(--bad-soft);color:var(--bad)}
.pill.warn{background:var(--warn-soft);color:var(--warn)}
ul.plain{margin:0;padding-left:18px;font-size:.88rem;display:flex;flex-direction:column;gap:3px}
.cites a{word-break:break-word}
.modal{position:fixed;inset:0;background:color-mix(in srgb,var(--ink) 45%,transparent);display:flex;align-items:center;justify-content:center;padding:max(16px,env(safe-area-inset-top,0px)) max(16px,env(safe-area-inset-right,0px)) max(16px,env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));z-index:10}
.modal .box{background:var(--sheet);border-radius:var(--r);max-width:720px;width:100%;max-height:90vh;overflow:auto;padding:18px;display:flex;flex-direction:column;gap:12px}
.modal .row{display:flex;gap:8px;flex-wrap:wrap;justify-content:flex-end}
.toast{position:fixed;left:50%;bottom:calc(20px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--sheet);padding:8px 14px;border-radius:var(--r);font-size:.88rem;z-index:20}
.spin{width:14px;height:14px;border:2px solid currentColor;border-right-color:transparent;border-radius:50%;animation:sp .8s linear infinite;display:inline-block}
@keyframes sp{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.spin{animation:none}details.grp>summary::after{transition:none}}
.foot{font-size:.8rem;color:var(--graphite);max-width:80ch}
</style>

<div class="wrap">
  <header class="mast">
    <div class="brand">
      <svg class="mark" viewBox="0 0 28 28" aria-hidden="true"><rect x="2" y="2" width="24" height="24" fill="none" stroke="var(--ink)" stroke-width="2"/><rect x="7" y="8" width="14" height="12" fill="var(--resi)"/><rect x="5" y="5" width="18" height="18" fill="none" stroke="var(--plan)" stroke-width="1.4" stroke-dasharray="3 2"/></svg>
      <h1>NJ Zoning Envelope</h1>
    </div>
    <div class="actions">
      <button class="btn" id="btnLoad" type="button">Load packet</button>
      <button class="btn" id="btnParse" type="button">Parse ordinance text</button>
      <button class="btn" id="btnExport" type="button">Export packet</button>
      <button class="btn ghost" id="btnReset" type="button">Start blank</button>
      <button class="btn" id="btnKey" type="button" hidden>Add API key</button>
    </div>
  </header>

  <section class="query" id="query" aria-label="Find a property">
    <div class="tabs" role="tablist">
      <button class="tab" role="tab" aria-selected="true" data-q="address" type="button">Address</button>
      <button class="tab" role="tab" aria-selected="false" data-q="blocklot" type="button">Block and lot</button>
    </div>
    <form id="qform" class="qrow">
      <div class="qrow" data-panel="address" >
        <label class="wide">New Jersey street address<input type="text" id="qAddress" placeholder="900 S Orange Ave, Short Hills, NJ 07078" autocomplete="street-address"></label>
      </div>
      <div class="qrow" data-panel="blocklot"  hidden>
        <label class="wide">Municipality<input type="text" id="qMun" list="muniList" placeholder="Millburn Township" autocomplete="off"></label>
        <datalist id="muniList"></datalist>
        <label>Block<input type="text" id="qBlock" placeholder="1001"></label>
        <label>Lot<input type="text" id="qLot" placeholder="5"></label>
        <label>Qualifier<input type="text" id="qQual" placeholder="optional"></label>
      </div>
      <label class="f check small" style="flex:0 0 auto"><input type="checkbox" id="qResearch" checked> Research the ordinance</label>
      <button class="btn primary" id="qGo" type="submit">Analyze property</button>
    </form>
    <div class="log" id="log" aria-live="polite"></div>
  </section>

  <div id="modeNote"></div>
  <div id="banner"></div>

  <div class="sheet">
    <aside class="rail" aria-label="Property and zoning standards">
      <div class="record" id="record"></div>
      <div id="editor"></div>
    </aside>
    <main class="results" id="results"></main>
  </div>

  <p class="foot">Planning estimate, not a zoning determination. Ordinances change and many lots carry conditions (approvals, deed restrictions, redevelopment plans) that this tool cannot see. Confirm with the municipal zoning officer or a land-use attorney before you price or file anything.</p>
</div>

<div class="modal" id="modal" hidden></div>
<div class="toast" id="toast" hidden></div>

const DEF = { assumptions: Z.DEFAULT_ASSUMPTIONS, market: Z.DEFAULT_MARKET };

function renderEditor(){
  const low = new Set(packet.rules?.confidence?.lowConfidenceFields || []);
  const host = $('#editor'); host.innerHTML = '';
  G.forEach((g, gi) => {
    const d = document.createElement('details'); d.className='grp'; if (g.open) d.open = true;
    d.innerHTML = `<summary>${escH(g.title)}</summary><div class="fields"></div>`;
    const box = $('.fields', d);
    (g.fields||[]).forEach(([path,label,unit,type='num',w]) => {
      const id = 'f_' + path.replace(/\./g,'_');
      const [root, ...rest] = path.split('.');
      const placeholder = DEF[root] ? DEF[root][rest.join('.')] : '';
      const v = get(packet, path);
      const lc = low.has(rest.at(-1)) || low.has(rest.join('.'));
      let html;
      if (type==='check') html = `<label class="f check ${w==='full'?'full':''}"><input type="checkbox" id="${id}" data-path="${path}" data-type="check" ${v?'checked':''}> ${escH(label)}</label>`;
      else if (type.startsWith('select:')) html = `<label class="f ${w==='full'?'full':''}"><span>${escH(label)}</span><select id="${id}" data-path="${path}" data-type="text">${type.slice(7).split(',').map(o=>`<option ${ (v||placeholder)===o?'selected':''}>${o}</option>`).join('')}</select></label>`;
      else html = `<label class="f ${w==='full'?'full':''} ${lc?'flagged':''}" ${lc?'title="Low confidence: verify against the ordinance"':''}><span>${escH(label)}<i>${escH(unit||'')}</i></span><input id="${id}" data-path="${path}" data-type="${type==='text'?'text':'num'}" type="${type==='text'?'text':'number'}" step="any" inputmode="decimal" value="${v??''}" placeholder="${placeholder??''}"></label>`;
      box.insertAdjacentHTML('beforeend', html);
    });
    (g.lists||[]).forEach(([path,label]) => {
      const id = 'f_' + path.replace(/\./g,'_');
      const v = (get(packet, path)||[]).join('\n');
      box.insertAdjacentHTML('beforeend', `<label class="f full"><span>${escH(label)}<i>one per line</i></span><textarea id="${id}" data-path="${path}" data-type="list" rows="3">${escH(v)}</textarea></label>`);
    });
    host.appendChild(d);
  });
  // bonuses
  const b = packet.rules?.bonuses || [];
  if (b.length){
    const d = document.createElement('details'); d.className='grp'; d.open = true;
    d.innerHTML = `<summary>Bonuses</summary><div class="fields">${b.map((x,i)=>`<label class="f check full"><input type="checkbox" data-bonus="${i}" ${x.apply?'checked':''}> <span style="display:block"><b>${escH(x.name)}</b>${x.farBonus?` (+${x.farBonus} FAR)`:''}${x.unitsBonus?` (+${x.unitsBonus} units)`:''}<br><span class="muted small">${escH(x.description||'')}</span></span></label>`).join('')}</div>`;
    host.appendChild(d);
  }
}

$('#editor').addEventListener('input', (e) => {

  if (el.dataset.bonus!==undefined){ packet.rules.bonuses[+el.dataset.bonus].apply = el.checked; return changed(); }
  const path = el.dataset.path; if (!path) return;

  if (el.dataset.type==='check') v = el.checked;
  else if (el.dataset.type==='num') v = el.value==='' ? null : +el.value;

  set(packet, path, v);
  if (path==='property.lotAcres' && v) { set(packet,'property.lotAreaSF', Math.round(v*43560)); const a=$('#f_property_lotAreaSF'); if(a) a.value=Math.round(v*43560); }
  if (packet.example) { packet.example = false; renderBanner(); }

// ---------- drawings ----------
function sitePlan(res){
  const L = res.lot, W = L.frontageFt || (L.lotSF?Math.sqrt(L.lotSF):null), D = L.depthFt || (L.lotSF?Math.sqrt(L.lotSF):null);
  if (!W || !D) return `<div class="muted small" style="padding:40px 10px;text-align:center">Enter lot area or frontage and depth to draw the site.</div>`;
  const vw = 360, vh = 300, pad = 46;
  const k = Math.min((vw-pad*2)/W, (vh-pad*2)/D);
  const w = W*k, h = D*k, x0 = (vw-w)/2, y0 = (vh-h)/2 - 6;
  const sb = L.setbacks, sideL = (sb.sideEachFt ?? sb.sideTotalFt/2) || 0, sideR = (sb.sideTotalFt||0) - sideL;
  const bx = x0 + sideL*k, bw = Math.max(0, w - (sb.sideTotalFt||0)*k), by = y0 + (sb.rearFt||0)*k, bh = Math.max(0, h - ((sb.frontFt||0)+(sb.rearFt||0))*k);
  const fp = res.footprint.value || 0;
  let fw = bw, fh = bw>0 ? fp*k*k / bw : 0;
  if (fh > bh) { fh = bh; fw = bh>0 ? Math.min(bw, fp*k*k/bh) : 0; }
  const fx = bx + (bw-fw)/2, fy = by + bh - fh;
  const ln = (x1,y1,x2,y2,c='var(--graphite)',dash='') => `<line x1="${x1}" y1="${y1}" x2="${x2}" y2="${y2}" stroke="${c}" stroke-width="1" ${dash?`stroke-dasharray="${dash}"`:''}/>`;
  let s = `<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Site plan showing lot, setback lines and building footprint">`;
  s += `<rect x="0" y="${y0+h+14}" width="${vw}" height="18" fill="var(--rule-soft)"/><text x="${vw/2}" y="${y0+h+27}" text-anchor="middle" class="svg-text">Street (front lot line)</text>`;
  s += `<rect x="${x0}" y="${y0}" width="${w}" height="${h}" fill="var(--sheet)" stroke="var(--ink)" stroke-width="1.6"/>`;
  if (bw>0 && bh>0) s += `<rect x="${bx}" y="${by}" width="${bw}" height="${bh}" fill="none" stroke="var(--plan)" stroke-width="1.2" stroke-dasharray="5 3"/>`;
  if (fw>0 && fh>0) s += `<rect x="${fx}" y="${fy}" width="${fw}" height="${fh}" fill="var(--resi)" fill-opacity=".85" stroke="var(--ink)" stroke-width=".8"/><text x="${fx+fw/2}" y="${fy+fh/2+4}" text-anchor="middle" class="svg-strong">${fmt(fp)} SF</text>`;
  // dimensions
  s += ln(x0, y0-14, x0+w, y0-14) + ln(x0,y0-18,x0,y0-10) + ln(x0+w,y0-18,x0+w,y0-10);
  s += `<text x="${x0+w/2}" y="${y0-19}" text-anchor="middle" class="svg-text">${fmt(W)} ft${L.frontageFt?'':' (est.)'}</text>`;
  s += ln(x0+w+14, y0, x0+w+14, y0+h) + ln(x0+w+10,y0,x0+w+18,y0) + ln(x0+w+10,y0+h,x0+w+18,y0+h);
  s += `<text x="${x0+w+20}" y="${y0+h/2}" class="svg-text" transform="rotate(90 ${x0+w+20} ${y0+h/2})" text-anchor="middle">${fmt(D)} ft</text>`;
  if (sb.frontFt) s += `<text x="${x0+4}" y="${y0+h-4}" class="svg-text">front ${sb.frontFt}′</text>`;
  if (sb.rearFt) s += `<text x="${x0+4}" y="${y0+11}" class="svg-text">rear ${sb.rearFt}′</text>`;
  if (sideL) s += `<text x="${x0+3}" y="${y0+h/2}" class="svg-text" transform="rotate(-90 ${x0+9} ${y0+h/2})" text-anchor="middle">side ${fmt(sideL,0)}′</text>`;
  // actual outline inset
  const o = packet.property?.outlineFt;
  if (o && o.length>3){
    const xs=o.map(p=>p[0]), ys=o.map(p=>p[1]); const mx=Math.min(...xs), Mx=Math.max(...xs), my=Math.min(...ys), My=Math.max(...ys);
    const ik = 54/Math.max(Mx-mx, My-my); const pts = o.map(p=>`${(8+(p[0]-mx)*ik).toFixed(1)},${(8+(My-p[1])*ik).toFixed(1)}`).join(' ');
    s += `<g><rect x="2" y="2" width="66" height="76" fill="var(--paper)" stroke="var(--rule)"/><polygon points="${pts}" fill="var(--resi-soft)" stroke="var(--ink)" stroke-width=".8"/><text x="35" y="74" text-anchor="middle" class="svg-text" style="font-size:9px">actual shape</text></g>`;
  }
  return s + '</svg>';
}

function section(res, scen){
  const A = res.assumptions, hMax = res.floors.heightFt;
  const used = scen?.floorsUsed || res.floors.value || 0, allowed = res.floors.value || used;
  if (!used) return `<div class="muted small" style="padding:40px 10px;text-align:center">Enter a height or story limit to draw the section.</div>`;
  const floorH = (i) => (A.groundFloorRetail && i===0) ? A.floorToFloorComFt : A.floorToFloorResFt;
  let totalH = 0; for (let i=0;i<Math.max(used,allowed);i++) totalH += floorH(i);
  const top = Math.max(totalH, hMax||0) * 1.12;
  const vw = 300, vh = 300, base = vh-30, k = (vh-56)/top, bw = 130, bx = 90;
  let s = `<svg viewBox="0 0 ${vw} ${vh}" role="img" aria-label="Building section showing floors against the height limit">`;
  s += `<line x1="20" y1="${base}" x2="${vw-10}" y2="${base}" stroke="var(--ink)" stroke-width="1.6"/><text x="22" y="${base+16}" class="svg-text">Grade</text>`;
  let y = base;
  for (let i=0;i<allowed;i++){
    const fh = floorH(i)*k; y -= fh;
    const isUsed = i < used, isCom = A.groundFloorRetail && i===0;
    s += `<rect x="${bx}" y="${y}" width="${bw}" height="${fh}" fill="${isUsed?(isCom?'var(--comm)':'var(--resi)'):'none'}" fill-opacity="${isUsed?(isCom?.55:.85):0}" stroke="var(--ink)" stroke-width=".8" ${isUsed?'':'stroke-dasharray="3 2"'}/>`;
    if (fh>11) s += `<text x="${bx+bw/2}" y="${y+fh/2+4}" text-anchor="middle" class="svg-text" style="fill:var(--ink)">${isCom?'Commercial':'Floor '+(i+1)}</text>`;
  }
  if (hMax){ const hy = base - hMax*k; s += `<line x1="40" y1="${hy}" x2="${vw-14}" y2="${hy}" stroke="var(--bad)" stroke-width="1.2" stroke-dasharray="6 3"/><text x="${vw-14}" y="${hy-5}" text-anchor="end" class="svg-strong" style="fill:var(--bad)">${hMax} ft limit</text>`; }
  s += `<text x="${bx+bw+8}" y="${base-totalH*k/2}" class="svg-text">${fmt(totalH,1)} ft</text>`;
  s += `<text x="${bx-8}" y="${base-6}" text-anchor="end" class="svg-text">${used} of ${allowed}</text>`;
  return s + '</svg>';
}

function tally(v,label,sub){ return `<div class="tally"><b>${v}</b><span>${escH(label)}</span>${sub?`<small>${escH(sub)}</small>`:''}</div>`; }
function ladder(cands, val){
  const vals = cands.filter(c=>c.value!==null&&isFinite(c.value)); const max = Math.max(...vals.map(c=>c.value), 1);
  return cands.map(c => {
    const na = c.value===null || !isFinite(c.value);
    const bind = !na && val!==null && Math.abs(c.value - val) < 0.5;
    return `<div class="rung ${bind?'binding':''} ${na?'na':''}"><span>${escH(c.label)}</span><span class="bar">${na?'':`<i style="width:${Math.max(2,c.value/max*100)}%"></i>`}</span><span class="v">${na?'not set':fmt(c.value)}</span></div>`;
  }).join('');
}
function usesCard(){
  const u = packet.rules?.uses||{}; const any = ['permitted','conditional','accessory','prohibited'].some(k=>(u[k]||[]).length);

function applyRules(rules, source){
  if (!rules || typeof rules!=='object') throw new Error('No standards came back.');
  const merged = { ...BLANK.rules, ...rules };
  if (!merged.district && packet.rules?.district) merged.district = packet.rules.district;
  merged.bonuses = [...(packet.rules?.bonuses||[]), ...(rules.bonuses||[])].filter((b,i,a)=>a.findIndex(x=>x.name===b.name)===i);
  merged.citations = [...(packet.rules?.citations||[]), ...(rules.citations||[])].filter((b,i,a)=>a.findIndex(x=>(x.url||x.label)===(b.url||b.label))===i);
  packet.rules = merged;
  if (rules.jurisdiction && !packet.property.jurisdiction) packet.property.jurisdiction = rules.jurisdiction;

// One interface over the three ways the page can run: the Node server, the GitHub Pages
// build (lookups in the browser via window.NJLookup), or a Claude artifact (no lookups).
const KEY_STORE = 'ze.anthropicKey';
function storedKey(){ try { return localStorage.getItem(KEY_STORE) || ''; } catch(_) { return ''; } }
const api = {
  lookup: (body) => mode.browser ? window.NJLookup.lookup(body, { onProgress: log }) : streamJSON('api/lookup', body),
  research: (body) => mode.browser ? window.NJLookup.research(storedKey(), body, log) : streamJSON('api/research', body),
  parse: async (body) => {
    if (mode.browser) return window.NJLookup.parse(storedKey(), body.text, body);
    const r = await fetch('api/parse',{method:'POST',headers:{'content-type':'application/json'},body:JSON.stringify(body)}).then(r=>r.json());
    if (r.error) throw new Error(r.error); return r.result;
  }
};
// Reads an NDJSON stream of {progress} lines ending in {result} or {error}.
async function streamJSON(url, body){
  const res = await fetch(url, { method:'POST', headers:{'content-type':'application/json'}, body: JSON.stringify(body) });
  if (!res.ok || !res.body) throw new Error(`Server returned ${res.status}`);
  const reader = res.body.getReader(); const dec = new TextDecoder(); let buf = '', result = null;
  while (true){
    const { value, done } = await reader.read(); if (done) break;
    buf += dec.decode(value, { stream:true });
    const lines = buf.split('\n'); buf = lines.pop();
    for (const line of lines){ if (!line.trim()) continue; const m = JSON.parse(line);
      if (m.progress) log(m.progress); if (m.error) throw new Error(m.error); if (m.result) result = m.result; }
  }
  return result || {};
}
async function researchOnline(refresh=false){
  log('Researching the zoning ordinance. This usually takes one to three minutes.');
  const ctx = { ...(packet.context||{}) }; delete ctx.sales; delete ctx.parcel;
  const result = await api.research({ property: packet.property, district: packet.rules?.district || '', overlays: packet.overlays || [], context: ctx, refresh });
  if (result){ applyRules(result, 'research'); log(`Standards loaded for ${result.district||'the district'}${result.confidence?.overall?` (${result.confidence.overall} confidence)`:''}.`); }
}

function keyNote(){
  $('#btnKey').textContent = mode.research ? 'API key saved' : 'Add API key';
  $('#modeNote').innerHTML = mode.research ? '' : `<div class="notice info"><div>Parcel, zoning map, constraint, flood and sales lookups run right in your browser. To have Claude read the town's ordinance and fill in the district standards, add your own Anthropic API key. It stays in this browser and is sent only to Anthropic.</div></div>`;
}
$('#btnKey').onclick = () => {
  const m = modal(`<h2>Anthropic API key</h2>
    <p class="small muted">Used only for ordinance research and parsing. It is saved in this browser's local storage and sent directly to api.anthropic.com, nowhere else. Get one at console.anthropic.com.</p>
    <label class="f full"><span>API key</span><input type="text" id="mKey" autocomplete="off" spellcheck="false" placeholder="sk-ant-…" value="${storedKey()?'••••••••  (saved)':''}"></label>
    <div class="row">${storedKey()?'<button class="btn" id="mKeyClear" type="button">Remove key</button>':''}<button class="btn" data-close type="button">Cancel</button><button class="btn primary" id="mKeySave" type="button">Save key</button></div>`);
  $('#mKeySave',m).onclick = () => { const v = $('#mKey',m).value.trim(); if (v && !v.startsWith('•')) { try { localStorage.setItem(KEY_STORE, v); } catch(_) { toast('This browser blocks local storage, so the key could not be saved.'); return; } } mode.research = !!storedKey(); keyNote(); closeModal(); toast(mode.research?'Key saved':'No key saved'); };
  const c = $('#mKeyClear',m); if (c) c.onclick = () => { try { localStorage.removeItem(KEY_STORE); } catch(_) {} mode.research = false; keyNote(); closeModal(); toast('Key removed'); };
};
renderAll();
detect();
})();
</script>
